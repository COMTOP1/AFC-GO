        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Delete a sponsor
      tags:
      - sponsors
  /teams:
    get:
      produces:
