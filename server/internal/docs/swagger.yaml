        name: ages
        required: true
        type: integer
      - description: Description
        in: formData
        name: description
        type: string
      - description: League
        in: formData
        name: league
        type: string
      - description: Division
        in: formData
        name: division
        type: string
      - description: League table URL
        in: formData
        name: leagueTable
        type: string
      - description: Fixtures URL
        in: formData
        name: fixtures
        type: string
      - description: Coach
        in: formData
        name: coach
        type: string
      - description: Physio
        in: formData
        name: physio
        type: string
      - description: Active
        in: formData
        name: isActive
        type: boolean
      - description: Youth
        in: formData
        name: isYouth
        type: boolean
      - description: Team photo
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/team.Public'
        "422":
