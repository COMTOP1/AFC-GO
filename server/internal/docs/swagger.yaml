basePath: /api/v1
definitions:
  affiliation.Public:
    properties:
      id:
        type: integer
      imageUrl:
        type: string
      name:
        type: string
      website:
        type: string
    type: object
  auth.CurrentUser:
    properties:
      email:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      name:
        type: string
      permissions:
        $ref: '#/definitions/auth.Permissions'
      phone:
        type: string
      role:
        type: string
      teamId:
        type: integer
    type: object
  auth.Permissions:
    properties:
      canEdit:
        type: boolean
      canManageGallery:
        type: boolean
      canManageUsers:
        type: boolean
    type: object
  document.Public:
    properties:
      fileUrl:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  image.Public:
    properties:
      caption:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
    type: object
  news.Article:
    properties:
      content:
        type: string
      date:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      title:
        type: string
    type: object
  programme.Public:
    properties:
      date:
        type: string
      fileUrl:
        type: string
      id:
        type: integer
      name:
        type: string
      season:
        $ref: '#/definitions/programme.PublicSeason'
    type: object
  programme.PublicSeason:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  programme.SeasonInput:
    properties:
      season:
        type: string
    type: object
  sponsor.Public:
    properties:
      id:
        type: integer
      imageUrl:
        type: string
      name:
        type: string
      purpose:
        type: string
      team:
        type: string
      website:
        type: string
    type: object
  web.APIError:
    properties:
      code:
        type: integer
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  web.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/web.APIError'
    type: object
  web.HealthResponse:
    properties:
      status:
        type: string
    type: object
  whatson.Event:
    properties:
      content:
        type: string
      date:
        type: string
      dateOfEvent:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      title:
        type: string
    type: object
info:
  contact: {}
  description: JSON API behind the AFC Aldermaston website.
  title: AFC Aldermaston API
  version: "1"
paths:
  /affiliations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/affiliation.Public'
            type: array
      summary: List affiliations
      tags:
      - affiliations
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Name
        in: formData
        name: name
        required: true
        type: string
      - description: Full URL
        in: formData
        name: website
        type: string
      - description: Logo
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/affiliation.Public'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Create an affiliation
      tags:
      - affiliations
  /affiliations/{id}:
    delete:
      parameters:
      - description: Affiliation ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Delete an affiliation
      tags:
      - affiliations
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CurrentUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Current user
      tags:
      - auth
  /documents:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/document.Public'
            type: array
      summary: List documents
      tags:
      - documents
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Display name
        in: formData
        name: name
        required: true
        type: string
      - description: PDF, DOCX, PPTX, TXT or image
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/document.Public'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Upload a document
      tags:
      - documents
  /documents/{id}:
    delete:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Delete a document
      tags:
      - documents
  /gallery:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/image.Public'
            type: array
      summary: List gallery photos
      tags:
      - gallery
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Caption
        in: formData
        name: caption
        type: string
      - description: Photo
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/image.Public'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Upload a gallery photo
      tags:
      - gallery
  /gallery/{id}:
    delete:
      parameters:
      - description: Photo ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Delete a gallery photo
      tags:
      - gallery
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.HealthResponse'
      summary: Health check
      tags:
      - system
  /news:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/news.Article'
            type: array
      summary: List news
      tags:
      - news
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Title
        in: formData
        name: title
        required: true
        type: string
      - description: HTML content (sanitised)
        in: formData
        name: content
        type: string
      - description: Image
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/news.Article'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Create a news article
      tags:
      - news
  /news/{id}:
    delete:
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Delete a news article
      tags:
      - news
    get:
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/news.Article'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Get a news article
      tags:
      - news
    patch:
      consumes:
      - multipart/form-data
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      - description: Title
        in: formData
        name: title
        type: string
      - description: HTML content (sanitised); empty clears it
        in: formData
        name: content
        type: string
      - description: Replacement image
        in: formData
        name: image
        type: file
      - description: Remove the current image
        in: formData
        name: removeImage
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/news.Article'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Update a news article
      tags:
      - news
  /programmes:
    get:
      parameters:
      - description: Season ID; omit for all
        in: query
        name: season
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/programme.Public'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: List programmes
      tags:
      - programmes
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Name
        in: formData
        name: name
        required: true
        type: string
      - description: YYYY-MM-DD
        in: formData
        name: date
        required: true
        type: string
      - description: Season ID (0 or omitted for none)
        in: formData
        name: seasonId
        type: integer
      - description: Programme PDF
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/programme.Public'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Upload a programme
      tags:
      - programmes
  /programmes/{id}:
    delete:
      parameters:
      - description: Programme ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Delete a programme
      tags:
      - programmes
  /seasons:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/programme.PublicSeason'
            type: array
      summary: List seasons
      tags:
      - programmes
    post:
      consumes:
      - application/json
      parameters:
      - description: Season name
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/programme.SeasonInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/programme.PublicSeason'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Create a season
      tags:
      - programmes
  /seasons/{id}:
    delete:
      parameters:
      - description: Season ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Delete a season
      tags:
      - programmes
    patch:
      consumes:
      - application/json
      parameters:
      - description: Season ID
        in: path
        name: id
        required: true
        type: integer
      - description: New name
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/programme.SeasonInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/programme.PublicSeason'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Rename a season
      tags:
      - programmes
  /sponsors:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/sponsor.Public'
            type: array
      summary: List sponsors
      tags:
      - sponsors
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Name
        in: formData
        name: name
        required: true
        type: string
      - description: Full URL
        in: formData
        name: website
        type: string
      - description: What they sponsor
        in: formData
        name: purpose
        type: string
      - description: A, O, Y or a team ID
        in: formData
        name: team
        type: string
      - description: Logo
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/sponsor.Public'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Create a sponsor
      tags:
      - sponsors
  /sponsors/{id}:
    delete:
      parameters:
      - description: Sponsor ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Delete a sponsor
      tags:
      - sponsors
  /whatson:
    get:
      parameters:
      - description: all (default), future or past
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/whatson.Event'
            type: array
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: List what's on
      tags:
      - whatson
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Title
        in: formData
        name: title
        required: true
        type: string
      - description: HTML content (sanitised)
        in: formData
        name: content
        type: string
      - description: YYYY-MM-DD
        in: formData
        name: dateOfEvent
        required: true
        type: string
      - description: Image
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/whatson.Event'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Create a what's-on event
      tags:
      - whatson
  /whatson/{id}:
    delete:
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Delete a what's-on event
      tags:
      - whatson
    get:
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/whatson.Event'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Get a what's-on event
      tags:
      - whatson
    patch:
      consumes:
      - multipart/form-data
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: Title
        in: formData
        name: title
        type: string
      - description: HTML content; empty clears it
        in: formData
        name: content
        type: string
      - description: YYYY-MM-DD
        in: formData
        name: dateOfEvent
        type: string
      - description: Replacement image
        in: formData
        name: image
        type: file
      - description: Remove the current image
        in: formData
        name: removeImage
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/whatson.Event'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Update a what's-on event
      tags:
      - whatson
swagger: "2.0"
