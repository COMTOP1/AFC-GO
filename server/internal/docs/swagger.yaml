      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/team.Public'
            type: array
      summary: List teams
      tags:
      - teams
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Name
        in: formData
        name: name
        required: true
        type: string
      - description: Upper age (under 19 makes a youth team)
